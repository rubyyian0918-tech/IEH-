<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Box 介面雛形</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 左側流程導覽 · 中間可切換「手機 / 電腦」的裝置框 · 右側對應心智圖與開發備註。單一深色主題（黑橘），刻意不做淺色版。 */
:root {
  --ink: #0c0a09;        /* App 底色 */
  --panel: #171311;      /* 卡片、面板 */
  --raise: #231d19;      /* 浮起層 */
  --line: #332a24;       /* 分隔線 */
  --text: #f4ede7;       /* 主要文字 */
  --mute: #a39388;       /* 次要文字 */
  --orange: #ff7a1a;     /* 品牌橘 */
  --orange-deep: #c85400;
  --on-orange: #1a0c02;
  --good: #52c98e;
  --warn: #f2b53a;
  --bad: #f0604f;
  --page: #070605;       /* 裝置外的展示背景 */
  --f-display: "Big Shoulders Display", "Noto Sans TC", "Arial Narrow", sans-serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--page); color: var(--text); font-family: var(--f-body); font-size: 14px; line-height: 1.55; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
svg.i { width: 1.35em; height: 1.35em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i.fill { fill: currentColor; stroke: none; }

/* ---------- 展示頁外框 ---------- */
.page { padding-inline: 16px; padding-block: 18px 40px; max-width: 1560px; margin: 0 auto; }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; padding-bottom: 18px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
.brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.logo { font-family: var(--f-display); font-weight: 900; font-size: 30px; letter-spacing: .02em; line-height: 1; }
.logo b { color: var(--orange); }
.brand small { color: var(--mute); font-size: 13px; }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { padding: 6px 14px; border-radius: 999px; color: var(--mute); font-size: 13px; font-weight: 500; }
.seg button.on { background: var(--orange); color: var(--on-orange); font-weight: 700; }

.stage-wrap { display: grid; grid-template-columns: 230px minmax(0, 1fr) 300px; gap: 28px; align-items: start; }
.flow { position: sticky; top: 16px; display: grid; gap: 18px; max-height: calc(100vh - 32px); overflow: auto; padding-right: 4px; scrollbar-width: thin; }
.flow h3 { margin: 0 0 6px; font-size: 11px; letter-spacing: .14em; color: var(--mute); font-weight: 700; }
.flow ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.flow li button { width: 100%; text-align: left; padding: 6px 10px; border-radius: 6px; color: var(--text); font-size: 13px; display: flex; align-items: center; gap: 8px; }
.flow li button:hover { background: var(--panel); }
.flow li button.on { background: var(--raise); color: var(--orange); }
.flow li button .step { font-family: var(--f-mono); font-size: 10px; color: var(--mute); width: 1.6em; }

.device-area { display: flex; justify-content: center; min-width: 0; }
.device { width: 392px; height: 812px; max-width: 100%; border-radius: 46px; padding: 12px; background: linear-gradient(145deg, #2a2420, #0f0d0c); box-shadow: 0 0 0 1px #3a312b, 0 30px 80px -20px rgba(255, 122, 26, .18), 0 20px 60px rgba(0,0,0,.6); transition: width .35s ease, height .35s ease, border-radius .35s ease; }
.device.desktop { width: 1060px; height: 700px; border-radius: 16px; padding: 10px; }
.screen { width: 100%; height: 100%; border-radius: 36px; overflow: hidden; position: relative; background: var(--ink); }
.device.desktop .screen { border-radius: 8px; }

.notes { position: sticky; top: 16px; display: grid; gap: 16px; }
.notes section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.notes h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: .14em; color: var(--mute); font-weight: 700; }
.notes h2 { margin: 0 0 4px; font-size: 18px; text-wrap: balance; }
.notes p { margin: 0; color: var(--mute); font-size: 13px; }
.notes code { font-family: var(--f-mono); font-size: 12px; color: var(--orange); word-break: break-all; }
.map-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.map-tags span { font-size: 12px; padding: 3px 9px; border-radius: 4px; background: var(--raise); border-left: 3px solid var(--orange); }
.map-tags span.new { border-left-color: var(--good); }
.legend { font-size: 12px; color: var(--mute); margin-top: 8px !important; }

@media (max-width: 1240px) {
  .stage-wrap { grid-template-columns: 200px minmax(0, 1fr); }
  .notes { grid-column: 1 / -1; position: static; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
}
@media (max-width: 820px) {
  .stage-wrap { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .flow { position: static; max-height: none; display: flex; overflow-x: auto; gap: 6px; padding-bottom: 6px; }
  .flow > div { display: contents; }
  .flow h3 { display: none; }
  .flow ul { display: flex; gap: 6px; }
  .flow li button { white-space: nowrap; background: var(--panel); border: 1px solid var(--line); }
  .flow li button .step { display: none; }
  .device { width: 100%; height: min(760px, calc(100dvh - 150px)); min-height: 600px; border-radius: 30px; padding: 8px; }
  .screen { border-radius: 24px; }
  .device.desktop { height: 640px; }
}

/* ---------- App 本體 ---------- */
.app { container-type: inline-size; position: relative; height: 100%; font-size: var(--afs, 15px); color: var(--text); background: var(--ink); }
.shell { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
.status { display: flex; justify-content: space-between; align-items: center; padding: 12px 26px 4px; font-size: 13px; font-weight: 700; font-family: var(--f-mono); }
.status .dots { display: flex; gap: 5px; align-items: center; }
.status .dots i { width: 16px; height: 9px; border: 1.5px solid var(--text); border-radius: 3px; display: inline-block; position: relative; }
.status .dots i::after { content: ""; position: absolute; inset: 1px 4px 1px 1px; background: var(--text); border-radius: 1px; }
.device.desktop .status { display: none; }
.view { overflow-y: auto; overflow-x: hidden; scrollbar-width: none; position: relative; min-height: 0; }
.view::-webkit-scrollbar { display: none; }

.tabbar { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: #0c0a09f2; padding: 6px 4px 16px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--mute); font-size: .72em; font-weight: 500; padding: 6px 0; letter-spacing: .02em; }
.tab.on { color: var(--text); }
.tab.on svg { color: var(--orange); }
.rail-logo { display: none; }

@container (min-width: 700px) {
  .shell { grid-template-columns: 210px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
  .status { display: none; }
  .tabbar { order: -1; grid-template-columns: none; grid-auto-rows: min-content; align-content: start; gap: 4px; border-top: 0; border-right: 1px solid var(--line); padding: 22px 12px; background: var(--ink); }
  .tab { flex-direction: row; gap: 12px; font-size: .92em; padding: 10px 12px; border-radius: 8px; }
  .tab.on { background: var(--raise); }
  .rail-logo { display: block; font-family: var(--f-display); font-weight: 900; font-size: 1.7em; padding: 0 12px 20px; line-height: 1; }
  .rail-logo b { color: var(--orange); }
}

/* 頁首 */
.hd { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 16px; background: linear-gradient(var(--ink) 55%, #0c0a0900); }
.hd.clear { position: absolute; left: 0; right: 0; background: linear-gradient(#000000b0, #00000000); }
.hd .logo { font-size: 1.6em; }
.hd h1 { margin: 0; font-size: 1.35em; font-weight: 900; }
.hd .acts { display: flex; gap: 4px; }
.icon-btn { width: 2.3em; height: 2.3em; display: grid; place-items: center; border-radius: 50%; position: relative; }
.icon-btn:hover { background: #ffffff14; }
.icon-btn .badge { position: absolute; top: 3px; right: 3px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--orange); color: var(--on-orange); font-size: 10px; font-weight: 900; display: grid; place-items: center; padding: 0 4px; font-family: var(--f-mono); }
.sub { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: var(--ink); border-bottom: 1px solid var(--line); }
.sub h1 { margin: 0; font-size: 1.05em; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 按鈕與標籤 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .45em; padding: .68em 1.15em; border-radius: 6px; font-weight: 700; font-size: .95em; white-space: nowrap; }
.btn.pri { background: var(--orange); color: var(--on-orange); }
.btn.pri:hover { background: #ff8c3a; }
.btn.sec { background: #ffffff1f; color: var(--text); }
.btn.sec:hover { background: #ffffff2e; }
.btn.ghost { border: 1px solid var(--line); color: var(--text); }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: .36em .95em; border-radius: 999px; border: 1px solid var(--line); color: var(--mute); font-size: .85em; font-weight: 500; }
.chip.on { background: var(--text); border-color: var(--text); color: var(--ink); font-weight: 700; }
.pill { display: inline-flex; align-items: center; gap: .3em; font-size: .72em; font-weight: 700; padding: .15em .55em; border-radius: 4px; background: #ffffff1a; color: var(--text); letter-spacing: .02em; }
.pill.age { border: 1px solid var(--mute); background: none; }
.pill.hot { background: var(--orange); color: var(--on-orange); }
.pill.good { background: #52c98e26; color: var(--good); }
.pill.warn { background: #f2b53a26; color: var(--warn); }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; color: var(--mute); font-size: .82em; }
.meta .star { color: var(--orange); display: inline-flex; align-items: center; gap: 2px; font-weight: 700; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* 封面 */
.cover { position: relative; overflow: hidden; border-radius: 6px; background: var(--panel); }
.cover svg { display: block; width: 100%; height: 100%; }
.cover .ttl { position: absolute; left: 8px; right: 8px; bottom: 7px; font-weight: 900; font-size: .9em; line-height: 1.2; text-shadow: 0 1px 8px #000; }
.cover .en { display: block; font-family: var(--f-display); font-weight: 800; font-size: .78em; letter-spacing: .06em; color: #ffffffb0; text-transform: uppercase; }
.cover .tagc { position: absolute; top: 6px; left: 6px; }
.cover .gb { position: absolute; top: 6px; right: 7px; font-family: var(--f-display); font-weight: 900; font-size: .75em; color: var(--orange); letter-spacing: .04em; }

/* 橫向列 */
.blk { margin-top: 1.4em; }
.blk-h { display: flex; align-items: baseline; justify-content: space-between; padding: 0 16px 8px; gap: 10px; }
.blk-h h2 { margin: 0; font-size: 1.05em; font-weight: 700; text-wrap: balance; }
.blk-h button { color: var(--mute); font-size: .8em; display: inline-flex; align-items: center; }
.row { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 4px; scroll-snap-type: x proximity; scroll-padding-inline: 16px; scrollbar-width: none; }
.row::-webkit-scrollbar { display: none; }
.row > * { scroll-snap-align: start; }
.card { flex: 0 0 44%; text-align: left; display: grid; gap: 6px; }
.card .cover { aspect-ratio: 16 / 10; }
.card:hover .cover { box-shadow: 0 0 0 2px var(--orange); }
.card .progress { height: 3px; background: #ffffff2a; border-radius: 2px; overflow: hidden; }
.card .progress i { display: block; height: 100%; background: var(--orange); }
.card .cap { font-size: .78em; color: var(--mute); }
@container (min-width: 700px) {
  .card { flex-basis: 22%; }
}

/* Top 10 */
.t10 { flex: 0 0 52%; display: flex; align-items: flex-end; text-align: left; }
.t10 .rank { font-family: var(--f-display); font-weight: 900; font-size: 7.2em; line-height: .8; color: var(--ink); -webkit-text-stroke: 2px #6b5e55; letter-spacing: -.06em; margin-right: -.12em; z-index: 1; }
.t10:hover .rank { -webkit-text-stroke-color: var(--orange); }
.t10 .cover { width: 62%; aspect-ratio: 2 / 3; flex: none; }
@container (min-width: 700px) { .t10 { flex-basis: 20%; } }

/* Hero */
.hero { position: relative; aspect-ratio: 4 / 5; max-width: 100%; }
.hero .cover { position: absolute; inset: 0; border-radius: 0; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(#0c0a0900 35%, #0c0a09d9 78%, var(--ink)); pointer-events: none; }
.hero .body { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 0 16px 6px; display: grid; gap: 10px; justify-items: center; text-align: center; }
.hero .kicker { font-family: var(--f-display); font-weight: 800; letter-spacing: .24em; font-size: .78em; color: var(--orange); }
.hero h2 { margin: 0; font-size: 2.3em; font-weight: 900; line-height: 1.05; text-wrap: balance; }
.hero p { margin: 0; color: #e8ddd4; font-size: .88em; max-width: 34ch; }
.hero .btns { display: flex; gap: 10px; }
@container (min-width: 700px) {
  .hero { aspect-ratio: auto; height: 25em; }
  .hero .body { justify-items: start; text-align: left; padding: 0 40px 30px; right: 40%; }
  .hero h2 { font-size: 2.8em; }
}

/* 格狀 */
.ggrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 10px; padding: 12px 16px 20px; }
.ggrid .card { flex: none; }
@container (min-width: 700px) { .ggrid { grid-template-columns: repeat(4, minmax(0, 1fr)); padding-inline: 24px; } }
.gname { font-weight: 700; font-size: .92em; line-height: 1.3; }

/* 詳情 */
.dhero { position: relative; aspect-ratio: 16 / 11; max-width: 100%; }
.dhero .cover { position: absolute; inset: 0; border-radius: 0; }
.dhero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(#0c0a0900 45%, var(--ink)); }
.dbody { padding: 0 16px 24px; display: grid; gap: 14px; position: relative; z-index: 2; margin-top: -2.4em; }
.dbody h1 { margin: 0; font-size: 1.9em; font-weight: 900; line-height: 1.1; }
.dbody .en { font-family: var(--f-display); font-weight: 800; color: var(--mute); letter-spacing: .1em; text-transform: uppercase; font-size: .9em; }
.dbody p { margin: 0; color: #ddd1c8; font-size: .92em; max-width: 60ch; }
.acts3 { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
.acts3 button { display: grid; justify-items: center; gap: 4px; color: var(--mute); font-size: .75em; padding: 6px 0; }
.acts3 button.on { color: var(--orange); }
.how { margin: 0; padding-left: 1.2em; color: #ddd1c8; font-size: .9em; display: grid; gap: 4px; }
.h3 { font-size: .98em; font-weight: 700; margin: 0; }
.dev { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; background: var(--panel); font-size: .85em; }
.dev .av { width: 2.2em; height: 2.2em; }
.lb { display: grid; gap: 2px; }
.lb div { display: grid; grid-template-columns: 1.6em 2em 1fr auto; gap: 8px; align-items: center; padding: 6px 0; font-size: .88em; border-bottom: 1px solid var(--line); }
.lb div:last-child { border-bottom: 0; }
.lb b { font-family: var(--f-display); font-size: 1.2em; color: var(--mute); }
.lb .me { color: var(--orange); }
@container (min-width: 700px) {
  .dhero { aspect-ratio: 21 / 7; }
  .dbody { padding-inline: 40px; grid-template-columns: minmax(0, 1fr) 280px; column-gap: 32px; align-items: start; }
  .dbody > * { grid-column: 1; }
  .dbody > .side { grid-column: 2; grid-row: 1 / span 6; }
}

/* 頭像 */
.av { width: 2.6em; height: 2.6em; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: .95em; flex: none; color: #fff; }

/* 列表 */
.list { display: grid; }
.li { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--line); text-align: left; width: 100%; min-height: 3.4em; }
.li:hover { background: #ffffff08; }
.li .t { flex: 1; min-width: 0; }
.li .t b { display: block; font-weight: 500; font-size: .95em; }
.li .t small { display: block; color: var(--mute); font-size: .78em; }
.li .v { color: var(--mute); font-size: .85em; text-align: right; }
.li .ic { width: 2.2em; height: 2.2em; border-radius: 8px; background: var(--raise); display: grid; place-items: center; color: var(--orange); flex: none; }
.li.hl { background: linear-gradient(90deg, #ff7a1a1f, #ff7a1a00); }
.group-t { padding: 18px 16px 6px; font-size: .74em; letter-spacing: .12em; color: var(--mute); font-weight: 700; }
.tg { width: 44px; height: 26px; border-radius: 13px; background: #4a3f38; position: relative; flex: none; transition: background .2s; }
.tg::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s; }
.tg.on { background: var(--orange); }
.tg.on::after { transform: translateX(18px); }
input[type=range] { accent-color: var(--orange); width: 7.5em; }

/* 個人頁 */
.prof { padding: 14px 16px 6px; display: flex; gap: 14px; align-items: center; }
.prof .av { width: 4.4em; height: 4.4em; font-size: 1.1em; box-shadow: 0 0 0 3px var(--ink), 0 0 0 5px var(--orange); }
.prof h2 { margin: 0; font-size: 1.3em; font-weight: 900; }
.lvl { display: grid; gap: 4px; margin-top: 4px; }
.bar { height: 6px; background: #ffffff1f; border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--orange-deep), var(--orange)); }
.walletc { margin: 10px 16px; padding: 14px 16px; border-radius: 12px; background: linear-gradient(120deg, #3a1d08, #1c120b 60%); border: 1px solid #5a3417; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
.walletc .big { font-family: var(--f-display); font-weight: 900; font-size: 2.1em; line-height: 1; }
.walletc .big small { font-size: .45em; color: var(--orange); letter-spacing: .1em; margin-left: 4px; }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); margin: 6px 16px 0; border: 1px solid var(--line); border-radius: 10px; }
.stats3 div { padding: 10px 8px; text-align: center; border-right: 1px solid var(--line); }
.stats3 div:last-child { border-right: 0; }
.stats3 b { display: block; font-family: var(--f-display); font-size: 1.5em; font-weight: 900; line-height: 1.1; }
.stats3 small { color: var(--mute); font-size: .74em; }
.banner { margin: 10px 16px; padding: 12px 14px; border-radius: 10px; background: var(--raise); border: 1px dashed #6b4a2f; display: flex; gap: 10px; align-items: center; font-size: .85em; }
.banner .t { flex: 1; }
.banner b { color: var(--orange); }

/* 商城 */
.pgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 12px 16px 20px; }
@container (min-width: 700px) { .pgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); padding-inline: 24px; } }
.prod { background: var(--panel); border-radius: 10px; overflow: hidden; text-align: left; display: grid; border: 1px solid var(--line); }
.prod:hover { border-color: var(--orange); }
.prod .cover { aspect-ratio: 1; border-radius: 0; }
.prod .pb { padding: 8px 10px 10px; display: grid; gap: 4px; }
.prod .pn { font-size: .86em; font-weight: 700; line-height: 1.3; }
.price { font-family: var(--f-mono); font-weight: 700; color: var(--orange); font-size: .9em; }
.cartrow { display: grid; grid-template-columns: 3.4em 1fr auto; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.cartrow .cover { aspect-ratio: 1; }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 6px; }
.qty button { width: 1.9em; height: 1.9em; }
.qty span { min-width: 1.6em; text-align: center; font-family: var(--f-mono); font-size: .85em; }
.sum { margin: 14px 16px; padding: 14px; border-radius: 10px; background: var(--panel); display: grid; gap: 8px; font-size: .9em; }
.sum div { display: flex; justify-content: space-between; gap: 10px; }

.pad { padding: 0 16px; }

@media (prefers-reduced-motion: reduce) {

function art(h, p, seed) {
  const id = 'a' + (uid++), R = rng(seed + p);
  const c1 = `hsl(${h} 62% 14%)`, c2 = `hsl(${(h + 18) % 360} 80% 34%)`, c3 = `hsl(${(h + 330) % 360} 95% 62%)`, c4 = `hsl(${(h + 40) % 360} 90% 72%)`;
  let s = '';

  if (p === 'dots') for (let y = 8; y < 100; y += 14) for (let x = 8; x < 160; x += 14) { const r = R(); if (r > .45) s += `<circle cx="${x + R() * 4}" cy="${y}" r="${2 + r * 5}" fill="${r > .85 ? c4 : c3}" opacity="${.3 + r * .6}"/>`; }
  if (p === 'grid') for (let y = 6; y < 100; y += 20) for (let x = 6; x < 160; x += 20) { const r = R(); s += `<rect x="${x}" y="${y}" width="16" height="16" rx="3" fill="${r > .75 ? c4 : r > .4 ? c3 : c2}" opacity="${r > .4 ? .8 : .45}"/>`; }
  if (p === 'rings') { const cx = 40 + R() * 80, cy = 30 + R() * 40; for (let i = 7; i > 0; i--) s += `<circle cx="${cx}" cy="${cy}" r="${i * 13}" fill="none" stroke="${i % 2 ? c3 : c4}" stroke-width="${3 + (i % 3)}" opacity="${.2 + i * .08}"/>`; }
  if (p === 'stripes') for (let i = -4; i < 14; i++) s += `<rect x="${i * 16}" y="-40" width="${6 + R() * 6}" height="200" fill="${i % 3 ? c3 : c4}" opacity="${.3 + R() * .5}" transform="rotate(28 80 50)"/>`;
  if (p === 'bricks') for (let y = 6; y < 70; y += 10) for (let x = (y / 10) % 2 ? 0 : -12; x < 160; x += 24) { const r = R(); if (r > .2) s += `<rect x="${x + 1}" y="${y}" width="22" height="8" rx="1.5" fill="${r > .7 ? c4 : c3}" opacity="${.45 + r * .5}"/>`; }
  if (p === 'bricks') s += `<circle cx="${60 + R() * 40}" cy="84" r="4" fill="#fff"/><rect x="58" y="92" width="44" height="4" rx="2" fill="${c4}"/>`;
  if (p === 'maze') { for (let i = 0; i < 26; i++) { const x = Math.floor(R() * 8) * 20 + 10, y = Math.floor(R() * 5) * 20 + 10, v = R() > .5; s += `<line x1="${x}" y1="${y}" x2="${v ? x : x + 20}" y2="${v ? y + 20 : y}" stroke="${c3}" stroke-width="3.5" stroke-linecap="round" opacity=".8"/>`; } s += `<circle cx="130" cy="70" r="6" fill="#ff7a1a"/>`; }

  return `<svg viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c2}"/><stop offset="1" stop-color="${c1}"/></linearGradient></defs><rect width="160" height="100" fill="url(#${id})"/>${s}</svg>`;
}

      <div class="acts3"><button class="${fav ? 'on' : ''}" data-act="fav" data-id="${g.id}">${ic(fav ? 'check' : 'plus')}${fav ? '已收藏' : '收藏'}</button>
        <button data-act="rate">${ic('star')}評分</button><button data-act="share">${ic('share')}分享給好友</button></div>

        <div><h3 class="h3" style="margin-bottom:4px">好友排行</h3><div class="lb">
          ${[['bear', 2340], ['me', S.best[g.id] || 1880], ['kiki', 1210]].sort((a, b) => b[1] - a[1]).map(([k, sc], i) => `<div class="${k === 'me' ? 'me' : ''}"><b>${i + 1}</b>${av(k === 'me' ? null : k, 'width:1.8em;height:1.8em;font-size:.75em')}<span>${k === 'me' ? '我' : PEOPLE[k].n}</span><span class="num">${sc.toLocaleString()}</span></div>`).join('')}</div></div>
      </div>
      <div class="blk" style="margin:4px -16px 0"><div class="blk-h"><h2>類似遊戲推薦</h2></div><div class="row">${sim.map(x => gcard(x, `<span class="cap">${x.cat} · ${x.tags.filter(t => g.tags.includes(t)).join('、') || '同類型'}</span>`)).join('')}</div></div>
    </div>`;
  },

  play(v) {
    const g = G[v.id];
    return `<div class="play" id="play">
      <div class="hud"><button class="icon-btn" data-act="pause" aria-label="暫停" style="background:#00000080;border:1px solid var(--line)">${ic('pause')}</button>

      <div class="playfoot">正在玩「${g.t}」· GameHost 容器（示範：以「點點橘子」代替成員遊戲）<br>今日已玩 <span class="num">${S.parental.mins - 18}</span> / ${S.parental.mins} 分鐘</div>

    </div>`;

  result(v) {

  },

  search() {
    const q = S.q.trim();
    const res = q ? GAMES.filter(g => (g.t + g.en + g.cat + g.tags.join('')).toLowerCase().includes(q.toLowerCase())) : [];
    return `${subHd('搜尋')}

    : `<div class="group-t">最近搜尋</div><div class="chips">${['數學', '節奏小鼓手', '迷宮'].map(s => `<button class="chip" data-act="q" data-v="${s}">${ic('history')} ${s}</button>`).join('')}</div>
      <div class="group-t">熱門搜尋</div><div class="list">${['星際跳跳', '數字泡泡', '雙人', '拼圖'].map((s, i) => `<button class="li" data-act="q" data-v="${s}"><span class="num" style="color:var(--orange);width:1.2em">${i + 1}</span><span class="t"><b>${s}</b></span>${ic('up')}</button>`).join('')}</div>

  },

      <span style="color:${i % 4 === 2 ? 'var(--bad)' : 'var(--good)'}">${ic(i % 4 === 2 ? 'down' : 'up')}</span></button>`).join('')}</div>`;

  store() {

  },

    const items = S.cart.map(c => ({ ...P[c.id], q: c.q }));

    return `${subHd('購物車與結帳')}
    ${items.length ? `${items.map(i => `<div class="cartrow">${pcover(i)}<div><b style="font-size:.92em">${i.n}</b><br><span class="price">${price(i)}</span></div>
      <div class="qty"><button data-act="qty" data-id="${i.id}" data-v="-1" aria-label="減少">−</button><span>${i.q}</span><button data-act="qty" data-id="${i.id}" data-v="1" aria-label="增加">+</button></div></div>`).join('')}
    <div class="sum">${g ? `<div><span class="muted">G 幣商品</span><span class="num">${g.toLocaleString()} G</span></div><div><span class="muted">G 幣餘額</span><span class="num" style="color:${g > S.coins ? 'var(--bad)' : 'inherit'}">${S.coins.toLocaleString()} G</span></div>` : ''}
      ${nt ? `<div><span class="muted">付款方式</span><button data-act="paym" style="color:var(--orange)">${pay} ›</button></div><div><span class="muted">發票</span><span>手機條碼載具</span></div>` : ''}
      <div class="tot"><span>合計</span><span class="num">${[g ? g.toLocaleString() + ' G' : '', nt ? 'NT$' + nt : ''].filter(Boolean).join(' + ')}</span></div></div>
    ${S.parental.buy ? `<div class="banner">${ic('shield')}<span class="t">家長控制已開啟：送出後會通知家長核准，核准後才會扣款。</span></div>` : ''}
    <div class="pad" style="padding-bottom:24px"><button class="btn pri wide" data-act="checkout" ${g > S.coins ? 'disabled' : ''}>${S.parental.buy ? '送出給家長核准' : '確認付款'}</button></div>`

  },

  inventory() {
    return `${subHd('個人商城資產')}
    <div class="chips" style="padding-top:12px">${['背包', '購買紀錄'].map(t => `<button class="chip ${S.invTab === t ? 'on' : ''}" data-act="inv" data-v="${t}">${t === '背包' ? '背包 / 倉庫' : t}</button>`).join('')}</div>
    ${S.invTab === '背包' ? `<div class="pgrid">${S.owned.map(id => P[id]).map(p => `<div class="prod">${pcover(p)}<div class="pb"><span class="pn">${p.n}</span><span class="muted" style="font-size:.74em">${p.type} · ${p.type === '道具' ? '剩餘 ' + (p.id === 'p4' ? 3 : 2) : '已裝備'}</span></div></div>`).join('')}</div>`

    <div class="group-t">優惠與票券</div><div class="list">

      ${[['儲值 G 幣 500', '09/02 14:21', '+500 G', 'var(--good)'], ['提示卡 ×5', '09/21 19:08', '−120 G', 'var(--text)'], ['復活愛心 ×3', '09/14 18:40', '−90 G', 'var(--text)'], ['遊戲獎勵 · 節奏小鼓手', '09/27 17:02', '+32 G', 'var(--good)']].map(([n, d, v, c]) => `<div class="li"><span class="t"><b>${n}</b><small class="num">${d}</small></span><span class="num" style="color:${c};font-weight:700">${v}</span></div>`).join('')}</div>`;

/* ================= 示範遊戲（點點橘子）================= */
let GT = null;
function startGame(v) {
  const arena = app.querySelector('#arena'), cd = app.querySelector('#cd');
  GT = { v, score: 0, left: 150, paused: false, timers: [], spawnAcc: 0, phase: 'count', count: 3 };
  const tick = () => {
    if (!GT || GT.paused) return;
    if (GT.phase === 'count') {
      GT.countAcc = (GT.countAcc || 0) + 1;
      if (GT.countAcc % 10 === 0) { GT.count--; if (GT.count <= 0) { GT.phase = 'run'; app.querySelector('#ready')?.remove(); } else cd.textContent = GT.count; }
      return;
    }
    GT.left--; GT.spawnAcc++;
    app.querySelector('#time').textContent = Math.ceil(GT.left / 10);
    if (GT.spawnAcc >= 6) { GT.spawnAcc = 0; spawn(arena); }
    if (GT.left <= 0) {
      const prev = S.best[v.id] || 0, score = GT.score;
      S.best[v.id] = Math.max(prev, score); S.coins += Math.round(score / 10);
      if (!S.recent.includes(v.id)) S.recent = [v.id, ...S.recent].slice(0, 3);
      stopGame(); replace('result', { id: v.id, score, prev });
    }
  };
  GT.iv = setInterval(tick, 100);
}
function spawn(arena) {
  const r = arena.getBoundingClientRect(), t = document.createElement('button');
  const gold = Math.random() < .18;
  t.className = 'tgt' + (gold ? ' gold' : ''); t.setAttribute('aria-label', gold ? '金橘子' : '橘子');
  t.style.left = (40 + Math.random() * Math.max(10, r.width - 80)) + 'px'; t.style.top = (40 + Math.random() * Math.max(10, r.height - 80)) + 'px';
  t.addEventListener('pointerdown', e => {
    e.stopPropagation(); if (!GT || GT.paused) return;
    const pts = gold ? 30 : 10; GT.score += pts; app.querySelector('#score').textContent = GT.score;
    t.classList.add('hit');
    const f = document.createElement('span'); f.className = 'float'; f.textContent = '+' + pts; f.style.left = t.style.left; f.style.top = t.style.top; arena.appendChild(f);
    setTimeout(() => f.remove(), 700);
  });
  arena.appendChild(t); setTimeout(() => t.remove(), 1150);
}
function stopGame() { if (GT) { clearInterval(GT.iv); GT = null; } }

    resume: () => { if (GT) { GT.paused = false; app.querySelector('#pauseov').hidden = true; } },
    restart: () => render(true), quit: () => back(),
    again: () => replace('play', { id: d.id }),
    toLib: () => { S.tab = 'library'; S.stacks.library = [{ s: 'library' }]; render(true); },
    q: () => { S.q = d.v; render(); },
    rank: () => { S.rankTab = d.v; render(); },
    scat: () => { S.storeCat = d.v; render(); }, ssort: () => { S.storeSort = d.v; render(); },
    topup: () => { if (needAccount('儲值')) return; go('product', { id: 'p3' }); },
    addcart: () => { if (needAccount('購物')) return; const c = S.cart.find(x => x.id === d.id); c ? c.q++ : S.cart.push({ id: d.id, q: 1 }); render(); toast('已加入購物車'); },
    buynow: () => { if (needAccount('購物')) return; if (!S.cart.find(x => x.id === d.id)) S.cart.push({ id: d.id, q: 1 }); go('cart'); },
    qty: () => { const c = S.cart.find(x => x.id === d.id); c.q += +d.v; if (c.q <= 0) S.cart = S.cart.filter(x => x !== c); render(); },
    paym: () => { S.set.pay0 = ((S.set.pay0 ?? 0) + 1) % 3; render(); },
    checkout: () => {
      const items = S.cart.map(c => ({ ...P[c.id], q: c.q })), g = items.filter(i => i.cur === 'G').reduce((a, i) => a + i.price * i.q, 0);
      const pending = S.parental.buy;
      items.forEach(i => S.orders.unshift({ n: i.n + (i.q > 1 ? ` ×${i.q}` : ''), d: '09/29', v: price(i), st: pending ? '待家長核准' : '完成' }));
      if (!pending) { S.coins -= g; items.forEach(i => { if (i.cur === 'G' && !S.owned.includes(i.id)) S.owned.push(i.id); }); if (items.some(i => i.cur === 'NT$')) S.coins += items.filter(i => i.cur === 'NT$').reduce((a, i) => a + (i.id === 'p3' ? 1300 : 500) * i.q, 0); }
      S.cart = []; S.invTab = '購買紀錄'; replace('inventory'); toast(pending ? '已送出，等待家長核准' : '付款成功，商品已放入背包');
    },
    inv: () => { S.invTab = d.v; render(); },
    copyid: () => { try { navigator.clipboard.writeText(S.user.id).then(() => toast('已複製用戶 ID'), () => toast('用戶 ID：' + S.user.id)); } catch (_) { toast('用戶 ID：' + S.user.id); } },
    ftab: () => { S.friendTab = d.v; render(); },
    accept: () => { S.invites.in = S.invites.in.filter(k => k !== d.v); render(); toast(S.parental.friend ? `已送出，家長核准後就會和 ${PEOPLE[d.v].n} 成為好友` : `你和 ${PEOPLE[d.v].n} 成為好友了`); },
    decline: () => { S.invites.in = S.invites.in.filter(k => k !== d.v); render(); },
    cancelinv: () => { S.invites.out = S.invites.out.filter(k => k !== d.v); render(); },
    add: () => { S.added.add(d.v); render(); toast(S.parental.friend ? '邀請已送出，等待家長核准' : '好友邀請已送出'); },
    import: () => toast(`${d.v}匯入：正式版會先請家長授權`),
    qr: () => sheet(`<h2>我的 QR Code</h2><div class="qrbox">${qr()}<span class="num">${S.user.id}</span><span class="muted" style="font-size:.8em">請好友用 Game Box 掃描這個 QR Code</span></div><button class="btn pri wide" data-act="closeSheet">${ic('qr')}改用相機掃描好友</button>`),
    setitem: () => {
      const g = SETTINGS.find(x => x.key === d.g), it = g.items[+d.i];
      if (it.type === 'select') S.set[d.k] = (setv(d.g, d.i, it) + 1) % it.opts.length;
      else if (it.type === 'toggle') S.set[d.k] = !setv(d.g, d.i, it);
      else { toast(`「${it.t}」細節頁將於下一版設計`); return; }
      if (d.k === 'display1' && S.set[d.k] !== 0) toast('雛形僅實作深色主題');
      render();
    },
    rawtg: () => { S.set[d.k] = S.set[d.k] === false; render(); },
    pin: () => {
      if (d.v === '⌫') S.pin = S.pin.slice(0, -1); else if (S.pin.length < 4) S.pin += d.v;
      if (S.pin.length === 4) { if (S.pin === '0000') { S.pinOk = true; S.pin = ''; render(); return; } render(); const dots = app.querySelector('#pindots'); dots.classList.add('shake'); setTimeout(() => { S.pin = ''; render(); }, 400); return; }
      render();
    },
    lockp: () => { S.pinOk = false; back(); toast('家長控制已鎖定'); },
    ptg: () => { S.parental[d.k] = !S.parental[d.k]; render(); },
    age: () => { const o = ['6+', '8+', '12+']; S.parental.age = o[(o.indexOf(S.parental.age) + 1) % o.length]; render(); },
    chat: () => { const o = ['預設片語', '僅好友', '關閉']; S.parental.chat = o[(o.indexOf(S.parental.chat) + 1) % o.length]; render(); },
    noop: () => toast('此頁面將於下一版設計'),
  };
  (A[d.act] || (() => {}))();
});
app.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q' && !e.isComposing) onQ(t);
  if (t.dataset.k) { S.set[t.dataset.k] = +t.value; t.nextElementSibling.textContent = t.value; }
  if (t.dataset.font) { S.afs = +t.value; app.style.setProperty('--afs', S.afs + 'px'); }
  if (t.dataset.pm) { S.parental.mins = +t.value; t.nextElementSibling.textContent = t.value + ' 分'; }
});
function onQ(t) { S.q = t.value; const pos = t.selectionStart; render(); const n = app.querySelector('#q'); n.focus(); n.setSelectionRange(pos, pos); }
app.addEventListener('compositionend', e => { if (e.target.id === 'q') onQ(e.target); });
app.addEventListener('change', e => { if (e.target.dataset.pm) render(); });
app.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'fq' && e.target.value.trim()) toast(`找到用戶 ${e.target.value.trim()}：${S.parental.friend ? '邀請需家長核准' : '已送出邀請'}`); });

function qr() {
  const R = rng(S.user.id), n = 25, c = 8; let s = '';
  const finder = (x, y) => `<rect x="${x * c}" y="${y * c}" width="${7 * c}" height="${7 * c}" fill="#000"/><rect x="${(x + 1) * c}" y="${(y + 1) * c}" width="${5 * c}" height="${5 * c}" fill="#fff"/><rect x="${(x + 2) * c}" y="${(y + 2) * c}" width="${3 * c}" height="${3 * c}" fill="#000"/>`;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) { const inF = (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9); if (!inF && R() > .52) s += `<rect x="${x * c}" y="${y * c}" width="${c}" height="${c}" fill="#000"/>`; }
  return `<svg viewBox="0 0 ${n * c} ${n * c}" aria-label="QR Code">${s}${finder(0, 0)}${finder(n - 7, 0)}${finder(0, n - 7)}<rect x="${n * c / 2 - 16}" y="${n * c / 2 - 16}" width="32" height="32" rx="6" fill="#ff7a1a"/></svg>`;
}
